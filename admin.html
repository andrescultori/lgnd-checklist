<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Legendários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@700;800&family=Work+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<style>
:root{
  --canvas: #EDE4CF; --canvas-deep: #E1D3B2; --paper: #F6F0E1;
  --ink: #262420; --ink-soft: #56503f; --line: #C9B993;
  --forest: #3F4B3A; --forest-deep: #2C3527; --forest-tint: #DFE4D6;
  --clay: #A6532E; --clay-deep: #7C3D22; --clay-tint: #F0DFCF;
  --steel: #3D6B72; --steel-deep: #294A50; --steel-tint: #DCE7E7;
}
*{ box-sizing:border-box; }
body{
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding-bottom:60px;
}
.page{ max-width:960px; margin:0 auto; padding:0 20px; }
body{ overflow-x:hidden; }
.filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.filters .field{ display:flex; flex-direction:column; gap:4px; }
.filters label{ font-size:11.5px; font-weight:600; color:var(--ink-soft); }
.filters select{ padding:8px 9px; border-radius:7px; border:1.5px solid var(--line); background:var(--canvas); font-family:inherit; font-size:13px; min-width:140px; }
.filters .btn{ padding:8px 12px; }
.gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 22px; background:var(--forest-deep); color:var(--paper); text-align:center; }
.gate h1{ font-size:26px; margin:0 0 10px; font-family:'Bitter', serif; }
.gate p{ opacity:.85; max-width:34ch; margin:0 0 24px; }
.google-btn{ display:flex; align-items:center; gap:10px; background:var(--paper); color:var(--ink); border:none; border-radius:10px; padding:12px 20px; font-family:'Work Sans', sans-serif; font-weight:600; font-size:14px; cursor:pointer; }
h1,h2,h3{ font-family:'Bitter', Georgia, serif; }
header.top{ background:var(--forest-deep); color:var(--paper); padding:22px 20px; margin-bottom:24px; }
header.top .page{ display:flex; justify-content:space-between; align-items:center; }
header.top h1{ font-size:22px; margin:0; }
.logout-btn{ background:rgba(246,240,225,.14); border:1px solid rgba(246,240,225,.4); color:var(--paper); font-family:inherit; font-size:12.5px; padding:7px 12px; border-radius:7px; cursor:pointer; }
.header-actions{ display:flex; align-items:center; gap:10px; }
.btn-link{ background:rgba(246,240,225,.14); border:1px solid rgba(246,240,225,.4); color:var(--paper); font-family:inherit; font-size:12.5px; padding:7px 12px; border-radius:7px; text-decoration:none; }
.kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:28px; }
.kpi{ background:var(--paper); border-radius:10px; padding:16px; border-left:4px solid var(--forest); }
.kpi .num{ font-size:26px; font-weight:800; font-family:'Bitter', serif; }
.kpi .label{ font-size:12.5px; color:var(--ink-soft); }
section{ background:var(--paper); border-radius:12px; padding:18px 20px; margin-bottom:20px; }
section h2{ font-size:17px; margin:0 0 14px; }
.badge{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
.badge.sim{ background:var(--forest-tint); color:var(--forest-deep); }
.badge.nao{ background:var(--clay-tint); color:var(--clay-deep); }
.row-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }

.user-card{ position:relative; background:var(--canvas); border:1.5px solid var(--line); border-radius:10px; padding:12px 44px 12px 14px; margin-bottom:10px; }
.user-card-primary{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.user-card-primary .user-name{ font-size:14.5px; font-weight:600; }
.user-card-primary .user-lgnd{ font-size:12px; color:var(--ink-soft); white-space:nowrap; flex-shrink:0; }
.user-card-secondary{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
.eye-btn{ position:absolute; top:10px; right:10px; background:none; border:none; color:var(--ink-soft); opacity:.5; cursor:pointer; padding:5px; border-radius:6px; touch-action:manipulation; }
.eye-btn:hover{ opacity:.85; }
.eye-btn.is-open{ opacity:1; color:var(--forest-deep); }
.user-card-details{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:6px; }
.detail-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12.5px; }
.detail-label{ color:var(--ink-soft); font-weight:600; flex-shrink:0; }
.detail-row > span:last-child{ text-align:right; overflow-wrap:anywhere; }
button.btn{ font-family:'Work Sans', sans-serif; font-size:12px; font-weight:600; padding:6px 10px; border-radius:6px; border:1.5px solid var(--line); background:var(--canvas); color:var(--ink); cursor:pointer; }
button.btn:hover{ border-color:var(--forest); }
button.btn.danger{ border-color:var(--clay); color:var(--clay-deep); }
button.btn.primary{ background:var(--forest-deep); border-color:var(--forest-deep); color:var(--paper); }
.msg{ font-size:12.5px; margin-top:8px; }
.msg.error{ color:var(--clay-deep); }
.msg.success{ color:var(--forest-deep); }
.loading{ padding:30px; text-align:center; color:var(--ink-soft); }
</style>
</head>
<body>

<div class="gate" id="screenLogin">
  <h1>Painel Admin — Legendários</h1>
  <p>Acesso restrito. Entre com a conta Google autorizada.</p>
  <button class="google-btn" id="loginBtn">Entrar com Google</button>
  <p class="msg error" id="loginError"></p>
</div>

<div class="gate" id="screenLoading" style="display:none"><p>Carregando…</p></div>
<div class="gate" id="screenDenied" style="display:none">
  <h1>Acesso negado</h1>
  <p>Essa conta não tem permissão pra ver este painel.</p>
  <button class="logout-btn" id="deniedLogout">Sair</button>
</div>

<div id="screenAdmin" style="display:none">
  <header class="top">
    <div class="page">
      <h1>Painel — Legendários</h1>
      <div class="header-actions">
        <a class="btn-link" href="index.html">Ir para Checklist</a>
        <button class="logout-btn" id="logoutBtn">Sair</button>
      </div>
    </div>
  </header>

  <div class="page">
    <div class="kpis" id="kpis"><div class="loading">Carregando KPIs…</div></div>

    <section>
      <h2>Usuários</h2>
      <div class="filters">
        <div class="field">
          <label>Pista</label>
          <select id="filtroPista"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label>Aceita contato</label>
          <select id="filtroContato">
            <option value="">Todos</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
          </select>
        </div>
        <div class="field">
          <label>Ordenar por</label>
          <select id="sortFieldSelect">
            <option value="nome_completo">Nome</option>
            <option value="numero_legendario">LGND #</option>
            <option value="created_at">Data de registro</option>
          </select>
        </div>
        <button class="btn" id="sortDirBtn" type="button" aria-label="Inverter ordem">↑</button>
      </div>
      <div id="listaUsuarios"><div class="loading">Carregando…</div></div>
    </section>

    <footer style="text-align:center; margin-top:24px; padding-top:16px; border-top:1px dashed var(--line); font-size:12px; color:var(--ink-soft);">
      Desenvolvido por <a href="https://github.com/andrescultori" target="_blank" rel="noopener noreferrer">André Scultori</a> · © 2026 · <a href="https://github.com/andrescultori/lgnd-checklist" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rbtcgurgjoounqwokygj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJidGNndXJnam9vdW5xd29reWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MTM0NjYsImV4cCI6MjEwNTA4OTQ2Nn0.66RTBQ9_eWQcP6L8wJief64ryvg2vCq280mZRTfXY44';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showScreen(id){
  ['screenLogin','screenLoading','screenDenied','screenAdmin'].forEach(s=>{
    document.getElementById(s).style.display = (s===id) ? (s==='screenAdmin'?'block':'flex') : 'none';
  });
}

async function callAdmin(action, extra){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-api`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${session.access_token}` },
    body: JSON.stringify({ action, ...extra }),
  });
  const data = await res.json();
  if(!res.ok){ throw new Error(data.error || 'Erro desconhecido'); }
  return data;
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  document.getElementById('loginError').textContent = '';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if(error){ document.getElementById('loginError').textContent = 'Erro: ' + error.message; }
});
document.getElementById('logoutBtn').addEventListener('click', ()=> sb.auth.signOut());
document.getElementById('deniedLogout').addEventListener('click', ()=> sb.auth.signOut());

let currentUserId = null;

sb.auth.onAuthStateChange((event, session)=>{
  // O cliente do Supabase reemite SIGNED_IN (com a mesma sessão) toda vez
  // que a aba volta a ficar visível e o token é revalidado — sem esse
  // filtro, voltar de outro app recarregava o painel inteiro. Só trata
  // como login de verdade se for outro usuário (ou o primeiro da sessão).
  if(event === 'SIGNED_IN' && session){
    if(currentUserId && currentUserId === session.user.id) return;
    boot();
  }
  if(event === 'SIGNED_OUT'){ currentUserId = null; showScreen('screenLogin'); }
});

async function boot(){
  showScreen('screenLoading');
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ showScreen('screenLogin'); return; }
  try{
    await loadAll();
    currentUserId = session.user.id;
    showScreen('screenAdmin');
  } catch(e){
    if(String(e.message).includes('Acesso negado')){ showScreen('screenDenied'); }
    else { document.getElementById('loginError').textContent = e.message; showScreen('screenLogin'); }
  }
}

async function loadAll(){
  await Promise.all([loadKpis(), loadUsuarios()]);
}

async function loadKpis(){
  const d = await callAdmin('kpis');
  const pistasHtml = d.listaPistas.map(p=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;"><span>${escapeHtml(p.pista)}</span><span>${p.qtd}</span></div>`).join('');
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="num">${d.totalCadastrados}</div><div class="label">Cadastrados</div></div>
    <div class="kpi" style="border-left-color:var(--steel);"><div class="label" style="margin-bottom:6px;">Pistas cadastradas</div>${pistasHtml || '<span style="font-size:12px;color:var(--ink-soft);">Nenhuma ainda</span>'}</div>
  `;
}

let allUsers = [];
let sortField = 'nome_completo';
let sortDir = 'asc';

async function loadUsuarios(){
  const d = await callAdmin('list_users');
  allUsers = d.users;
  popularFiltroPista();
  renderUsuarios();
}

function popularFiltroPista(){
  const select = document.getElementById('filtroPista');
  const atual = select.value;
  const pistas = [...new Set(allUsers.map(u => (u.pista || '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  select.innerHTML = '<option value="">Todas</option>' + pistas.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
  if(pistas.includes(atual)) select.value = atual;
}

function fmtData(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-BR');
}

function eyeIconSvg(){
  return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
}

function userCardHtml(u){
  return `
    <div class="user-card">
      <button class="eye-btn" onclick="toggleCardDetails(this)" aria-label="Ver mais detalhes" aria-expanded="false">${eyeIconSvg()}</button>
      <div class="user-card-primary">
        <span class="user-name">${escapeHtml(u.nome_completo)}</span>
        <span class="user-lgnd">LGND #${escapeHtml(u.numero_legendario || '—')}</span>
      </div>
      <div class="user-card-secondary">
        <span>${escapeHtml(u.pista || '—')}</span>
        <span>${fmtData(u.created_at)}</span>
      </div>
      <div class="user-card-details" style="display:none">
        <div class="detail-row"><span class="detail-label">E-mail</span><span>${escapeHtml(u.email)}</span></div>
        <div class="detail-row"><span class="detail-label">1º TOP</span><span>${escapeHtml(u.primeiro_top || '—')}</span></div>
        <div class="detail-row"><span class="detail-label">Aceita contato</span><span class="badge ${u.aceita_contato ? 'sim' : 'nao'}">${u.aceita_contato ? 'Sim' : 'Não'}</span></div>
        <div class="row-actions">
          <button class="btn danger" onclick="apagarUsuario('${u.id}', '${escapeHtml(u.email)}')">Apagar</button>
        </div>
      </div>
    </div>`;
}

function toggleCardDetails(btn){
  const details = btn.closest('.user-card').querySelector('.user-card-details');
  const isOpen = details.style.display !== 'none';
  details.style.display = isOpen ? 'none' : 'block';
  btn.classList.toggle('is-open', !isOpen);
  btn.setAttribute('aria-expanded', String(!isOpen));
}

function renderUsuarios(){
  const lista_el = document.getElementById('listaUsuarios');
  const filtroPista = document.getElementById('filtroPista').value;
  const filtroContato = document.getElementById('filtroContato').value;

  let lista = allUsers.filter(u => {
    if(filtroPista && (u.pista || '').trim() !== filtroPista) return false;
    if(filtroContato === 'sim' && !u.aceita_contato) return false;
    if(filtroContato === 'nao' && u.aceita_contato) return false;
    return true;
  });

  lista.sort((a,b) => {
    const cmp = compararUsuarios(a, b, sortField);
    return sortDir === 'asc' ? cmp : -cmp;
  });

  if(!lista.length){ lista_el.innerHTML = '<p style="text-align:center;color:var(--ink-soft);padding:16px 0;">Nenhum usuário encontrado</p>'; return; }

  lista_el.innerHTML = lista.map(u => userCardHtml(u)).join('');
}

function compararUsuarios(a, b, field){
  if(field === 'numero_legendario'){
    const na = parseInt(a.numero_legendario, 10);
    const nb = parseInt(b.numero_legendario, 10);
    const va = Number.isNaN(na) ? Infinity : na;
    const vb = Number.isNaN(nb) ? Infinity : nb;
    if(va !== vb) return va - vb;
    return (a.numero_legendario || '').localeCompare(b.numero_legendario || '', 'pt-BR');
  }
  if(field === 'created_at'){
    const da = a.created_at ? new Date(a.created_at).getTime() : -Infinity;
    const db = b.created_at ? new Date(b.created_at).getTime() : -Infinity;
    return da - db;
  }
  return (a.nome_completo || '').localeCompare(b.nome_completo || '', 'pt-BR');
}

document.getElementById('filtroPista').addEventListener('change', renderUsuarios);
document.getElementById('filtroContato').addEventListener('change', renderUsuarios);
document.getElementById('sortFieldSelect').addEventListener('change', (e)=>{ sortField = e.target.value; renderUsuarios(); });
document.getElementById('sortDirBtn').addEventListener('click', ()=>{
  sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  document.getElementById('sortDirBtn').textContent = sortDir === 'asc' ? '↑' : '↓';
  renderUsuarios();
});
async function apagarUsuario(id, email){
  if(!confirm(`Apagar ${email} por completo? Isso remove o login e todos os dados dele. Não tem como desfazer.`)) return;
  try{ await callAdmin('delete_user', { userId: id }); await loadUsuarios(); await loadKpis(); }
  catch(e){ alert(e.message); }
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ boot(); } else { showScreen('screenLogin'); }
})();
</script>
</body>
</html>
